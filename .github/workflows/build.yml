name: Build Forge 1.20.1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod and corresponding source
        run: bash gradlew build sourcesZip --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: colony-spawn-guard-1.20.1
          path: |
            build/libs/*.jar
            build/distributions/*-source.zip
